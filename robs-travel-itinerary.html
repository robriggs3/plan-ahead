<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rob · Travel Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f5f1e8; --bg-card: #ffffff; --bg-soft: #ebe7dd;
  --border: #d4cdb8; --border-light: #e5e0d0;
  --text: #1a1a1a; --text-2: #4a4a4a; --text-3: #8a8a8a;
  --accent: #c72027; --green: #0d8f3f; --green-soft: #e3f3e9;
  --blue: #2d5fb8; --blue-soft: #e3ebf5; --amber: #c79620; --amber-soft: #f7f0db;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 18px 60px; }
.doc { max-width: 880px; margin: 0 auto; }
.cover { text-align: center; padding: 30px 0 36px; border-bottom: 2px solid var(--text); margin-bottom: 36px; position: relative; }
.cover::before { content: 'TRAVEL TRACKER'; position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 0.3em; padding: 5px 13px; border: 1px solid var(--accent); border-radius: 2px; }
.cover h1 { font-family: 'Fraunces', Georgia, serif; font-size: 46px; font-weight: 400; font-style: italic; line-height: 1.1; margin-top: 24px; }
.cover h1 .em { color: var(--accent); font-style: normal; font-weight: 500; }
.cover .sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 14px; }
.current-banner { background: var(--bg-card); border: 2px solid var(--accent); border-radius: 12px; padding: 20px 26px; box-shadow: 0 4px 16px rgba(199,32,39,0.08); margin-bottom: 32px; position: relative; padding-top: 36px; }
.current-banner::before { content: '● Currently here'; position: absolute; top: 0; left: 0; background: var(--accent); color: white; padding: 5px 14px; border-radius: 0 0 6px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; }
.current-banner h2 { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 500; line-height: 1.2; }
.current-banner .country { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
.current-banner .dates { margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-2); }
.current-banner .accom { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-light); font-size: 13px; color: var(--text-2); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 36px 0 18px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.section-head h2 { font-family: 'Fraunces', Georgia, serif; font-size: 26px; font-weight: 500; font-style: italic; }
.section-head .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); letter-spacing: 0.12em; text-transform: uppercase; }
.leg { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 10px; padding: 16px 22px; margin-bottom: 10px; }
.leg.past { opacity: 0.7; }
.leg-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.leg-title { font-family: 'Fraunces', Georgia, serif; font-size: 19px; font-weight: 500; }
.leg-title .country { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); letter-spacing: 0.1em; font-weight: 400; margin-left: 8px; text-transform: uppercase; }
.leg-dates { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-2); }
.leg-accom { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-light); font-size: 12px; color: var(--text-3); line-height: 1.55; }
.leg-accom strong { color: var(--text-2); font-weight: 500; }
.leg-accom a { color: var(--accent); text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.pill { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; font-weight: 500; margin-left: 8px; }
.pill.booked { background: var(--green-soft); color: var(--green); }
.pill.shortlisted { background: var(--blue-soft); color: var(--blue); }
.pill.tentative { background: var(--amber-soft); color: var(--amber); }
#map { height: 380px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 24px; z-index: 1; }
footer { margin-top: 50px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); letter-spacing: 0.1em; }
.empty { color: var(--text-3); font-style: italic; padding: 20px; text-align: center; }
@media (max-width: 600px) { .cover h1 { font-size: 32px; } .current-banner h2 { font-size: 22px; } #map { height: 280px; } }
</style>
</head>
<body>
<div class="doc">
  <div class="cover">
    <h1>Rob · <span class="em">on the move</span></h1>
    <div class="sub" id="cover-meta">Loading…</div>
  </div>
  <div id="current-section"></div>
  <div class="section-head"><h2>The map</h2><span class="meta">All stops</span></div>
  <div id="map"></div>
  <div id="future-section"></div>
  <div id="past-section"></div>
  <footer>Auto-updates on each visit · Generated Jun 1, 2026</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = {"travelerName":"Rob","generatedAt":"2026-06-01T12:52:08.837Z","cities":[{"name":"Malaga","country":"Spain","state":"","status":"booked","checkIn":"2026-04-12","checkOut":"2026-06-05","lat":36.7213,"lng":-4.4214,"accommodations":[{"name":"Futurotel","neighborhood":"Malaguena","link":"","status":"booked"},{"name":"Hostel Superlativo","neighborhood":"Trinidad","link":"","status":"booked"},{"name":"Coeo Hernan Ruiz","neighborhood":"Centro","link":"","status":"booked"},{"name":"Idealista","neighborhood":"Azucena Street","link":"","status":"booked"},{"name":"Idealista","neighborhood":"Pedregalejo","link":"","status":"booked"}]},{"name":"ATLANTA","country":"United States","state":"GA","status":"booked","checkIn":"2026-01-01","checkOut":"2026-04-12","lat":33.749,"lng":-84.388,"accommodations":[]},{"name":"Funchal (Madeira)","country":"Portugal","state":"","status":"booked","checkIn":"2026-08-15","checkOut":"2026-08-29","lat":32.6669,"lng":-17.0012,"accommodations":[]},{"name":"Mindelo (Cape Verde)","country":"Cape Verde","state":"","status":"booked","checkIn":"2026-08-01","checkOut":"2026-08-15","lat":16.8833,"lng":-24.6667,"accommodations":[]},{"name":"Essaouira","country":"Morocco","state":"","status":"booked","checkIn":"2026-06-28","checkOut":"2026-08-01","lat":31.5125,"lng":-9.77,"accommodations":[{"name":"Riad Beldy","neighborhood":"","link":"","status":"booked"},{"name":"Riad Salmiya Dune","neighborhood":"","link":"","status":"booked"},{"name":"Riad Zawia","neighborhood":"","link":"","status":"booked"},{"name":"Sweet Taghazout Studios","neighborhood":"","link":"","status":"booked"}]},{"name":"ATLANTA","country":"United States","state":"GA","status":"booked","checkIn":"2026-06-10","checkOut":"2026-06-27","lat":33.749,"lng":-84.388,"accommodations":[{"name":"BCA","neighborhood":"","link":"","status":"booked"}]},{"name":"Istanbul","country":"Turkey","state":"","status":"shortlisted","checkIn":"2026-08-29","checkOut":"2026-09-25","lat":41.0082,"lng":28.9784,"accommodations":[]},{"name":"ATLANTA","country":"United States","state":"GA","status":"booked","checkIn":"2026-06-05","checkOut":"2026-06-06","lat":33.749,"lng":-84.388,"accommodations":[{"name":"AC Hotel by Marriott Atlanta Perimeter","neighborhood":"","link":"https://secure.booking.com/mytrips.html?label=gen173nr-10CAEoggI46AdIM1gEaEaIAQGYATO4AQfIAQzYAQPoAQH4AQGIAgGoAgG4ApPL9dAGwAIB0gIkY2NiY2ZkMmYtZTI3Yy00Y2E5LTk4NjYtY2M4YzNlY2JlZGYx2AIB4AIB&sid=b70c6187f7b7162224dbd34376adb01e&aid=304142&trip_id=304911806838853","status":"booked"}]},{"name":"Miami","country":"United States","state":"GA","status":"booked","checkIn":"2026-06-06","checkOut":"2026-06-10","lat":25.7617,"lng":-80.1918,"accommodations":[{"name":"Fontainblue","neighborhood":"Miami","link":"","status":"booked"}]}]};
const TODAY = new Date().toISOString().slice(0,10);

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHTML(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAccom(accoms) {
  if (!accoms || !accoms.length) return '';
  const bookedAccoms = accoms.filter(a => a.status === 'booked');
  const list = bookedAccoms.length > 0 ? bookedAccoms : accoms;
  return list.map(a => {
    const linkBit = a.link ? ' · <a href="' + escapeHTML(a.link) + '" target="_blank" rel="noopener">view</a>' : '';
    const nbhdBit = a.neighborhood ? ' · <em>' + escapeHTML(a.neighborhood) + '</em>' : '';
    const statusBit = a.status === 'booked' ? '<strong>Staying at:</strong> ' : '<strong>Considering:</strong> ';
    return '<div>' + statusBit + escapeHTML(a.name) + nbhdBit + linkBit + '</div>';
  }).join('');
}

function pill(status) {
  const valid = ['booked','shortlisted','tentative'];
  if (!valid.includes(status)) return '';
  return '<span class="pill ' + status + '">' + status + '</span>';
}

function render() {
  // Categorize
  let current = null;
  const past = [], future = [];
  DATA.cities.forEach(c => {
    if (!c.checkIn || !c.checkOut) { future.push(c); return; }
    if (c.checkIn <= TODAY && c.checkOut > TODAY) { current = c; return; }
    if (c.checkOut <= TODAY) past.push(c);
    else future.push(c);
  });
  past.sort((a,b) => (b.checkIn||'').localeCompare(a.checkIn||''));
  future.sort((a,b) => (a.checkIn||'').localeCompare(b.checkIn||''));

  // Cover meta
  const totalLabel = DATA.cities.length + ' stops · ' + past.length + ' past · ' + (current ? '1 current · ' : '') + future.length + ' upcoming';
  document.getElementById('cover-meta').textContent = totalLabel;

  // Current section
  const cs = document.getElementById('current-section');
  if (current) {
    const daysLeft = Math.round((new Date(current.checkOut + 'T00:00:00') - new Date(TODAY + 'T00:00:00')) / 86400000);
    cs.innerHTML = '<div class="current-banner">' +
      '<h2>' + escapeHTML(current.name) + '</h2>' +
      '<div class="country">' + escapeHTML(current.country) + (current.state ? ' · ' + escapeHTML(current.state) : '') + '</div>' +
      '<div class="dates">' + fmtDate(current.checkIn) + ' → ' + fmtDate(current.checkOut) + ' · ' + daysLeft + ' day' + (daysLeft===1?'':'s') + ' left</div>' +
      (current.accommodations.length ? '<div class="accom">' + renderAccom(current.accommodations) + '</div>' : '') +
    '</div>';
  } else {
    cs.innerHTML = '<div class="current-banner" style="border-color:var(--border);box-shadow:none;padding-top:20px"><div style="text-align:center;color:var(--text-3);font-style:italic">Between stays — see upcoming below</div></div>';
    cs.querySelector('.current-banner').style.padding = '20px';
    const b = cs.querySelector('.current-banner');
    if (b) { b.style.borderColor = 'var(--border)'; b.style.boxShadow = 'none'; }
  }

  // Future section
  const fs = document.getElementById('future-section');
  fs.innerHTML = '<div class="section-head"><h2>What\'s coming up</h2><span class="meta">' + future.length + ' stop' + (future.length===1?'':'s') + '</span></div>';
  if (future.length === 0) {
    fs.innerHTML += '<div class="empty">No upcoming trips planned yet.</div>';
  } else {
    future.forEach(c => fs.innerHTML += buildLeg(c, false));
  }

  // Past section
  if (past.length > 0) {
    const ps = document.getElementById('past-section');
    ps.innerHTML = '<div class="section-head"><h2>Where I\'ve been</h2><span class="meta">' + past.length + ' stop' + (past.length===1?'':'s') + '</span></div>';
    past.forEach(c => ps.innerHTML += buildLeg(c, true));
  }

  // Map
  initMap(DATA.cities, current);
}

function buildLeg(c, isPast) {
  const cls = isPast ? 'leg past' : 'leg';
  return '<div class="' + cls + '">' +
    '<div class="leg-head">' +
      '<div class="leg-title">' + escapeHTML(c.name) +
        '<span class="country">' + escapeHTML(c.country) + (c.state ? ' · ' + escapeHTML(c.state) : '') + '</span>' +
        pill(c.status) +
      '</div>' +
      '<div class="leg-dates">' + fmtDate(c.checkIn) + ' → ' + fmtDate(c.checkOut) + '</div>' +
    '</div>' +
    (c.accommodations.length ? '<div class="leg-accom">' + renderAccom(c.accommodations) + '</div>' : '') +
  '</div>';
}

function initMap(cities, current) {
  const valid = cities.filter(c => typeof c.lat === 'number' && typeof c.lng === 'number');
  if (valid.length === 0) {
    document.getElementById('map').innerHTML = '<div class="empty">No locations to map yet.</div>';
    return;
  }
  const map = L.map('map').setView([valid[0].lat, valid[0].lng], 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 18
  }).addTo(map);
  const bounds = [];
  valid.forEach(c => {
    const isCurrent = current && c.name === current.name;
    const isPast = c.checkOut && c.checkOut <= TODAY && !isCurrent;
    const color = isCurrent ? '#c72027' : (isPast ? '#8a8a8a' : '#0d8f3f');
    const radius = isCurrent ? 11 : 7;
    const marker = L.circleMarker([c.lat, c.lng], {
      radius: radius, color: 'white', weight: 2, fillColor: color, fillOpacity: 0.9
    }).addTo(map);
    const datesBit = c.checkIn ? '<br><small>' + fmtDate(c.checkIn) + ' → ' + fmtDate(c.checkOut) + '</small>' : '';
    marker.bindPopup('<strong>' + escapeHTML(c.name) + '</strong><br>' + escapeHTML(c.country) + datesBit + (isCurrent ? '<br><strong style="color:#c72027">★ Currently here</strong>' : ''));
    bounds.push([c.lat, c.lng]);
  });
  if (bounds.length > 1) map.fitBounds(bounds, { padding: [40, 40] });
}

render();
</script>
</body>
</html>
