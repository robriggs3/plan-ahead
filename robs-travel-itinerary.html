function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHTML(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Status -> marker color (mirrors itinerary pill colors). Past trumps status (gray). Current trumps everything (red).
function colorFor(city, isCurrent) {
  if (isCurrent) return '#c72027';
  if (city.checkOut && city.checkOut <= TODAY) return '#8a8a8a';
  const s = city.status || 'tentative';
  if (s === 'booked') return '#2d7d34';
  if (s === 'shortlisted') return '#2c5d8a';
  return '#8a6d00';
}

function isCurrentAccommodation(a) {
  if (!a.checkIn || !a.checkOut) return false;
  return a.checkIn <= TODAY && a.checkOut > TODAY;
}

function renderAccoms(accoms, isCurrentCity) {
  if (!accoms || !accoms.length) return '';
  const booked = accoms.filter(a => a.status === 'booked');
  const list = booked.length > 0 ? booked : accoms;
  return list.map(a => {
    const isCurrentAccom = isCurrentCity && isCurrentAccommodation(a);
    const cls = 'accom-item' + (isCurrentAccom ? ' current' : '');
    const linkBit = a.link ? ' · <a href="' + escapeHTML(a.link) + '" target="_blank" rel="noopener">view booking</a>' : '';
    const nbhdBit = a.neighborhood ? escapeHTML(a.neighborhood) + ' · ' : '';
    const datesBit = a.checkIn && a.checkOut ? fmtDate(a.checkIn) + ' → ' + fmtDate(a.checkOut) : '';
    return '<div class="' + cls + '"><div class="accom-name">' + escapeHTML(a.name) + '</div><div class="accom-meta">' + nbhdBit + datesBit + linkBit + '</div></div>';
  }).join('');
}

function pill(status) {
  const valid = ['booked','shortlisted','tentative'];
  if (!valid.includes(status)) return '';
  return '<span class="pill ' + status + '">' + status + '</span>';
}

function render() {
  let current = null;
  const past = [], future = [];
  DATA.cities.forEach(c => {
    if (!c.checkIn || !c.checkOut) { future.push(c); return; }
    if (c.checkIn <= TODAY && c.checkOut > TODAY) { current = c; return; }
    if (c.checkOut <= TODAY) past.push(c);
    else future.push(c);
  });
  past.sort((a,b) => (b.checkIn||'').localeCompare(a.checkIn||''));
  future.sort((a,b) => (a.checkIn||'').localeCompare(b.checkIn||''));

  const totalLabel = DATA.cities.length + ' stops · ' + past.length + ' past · ' + (current ? '1 current · ' : '') + future.length + ' upcoming';
  document.getElementById('cover-meta').textContent = totalLabel;
  document.getElementById('gen-date').textContent = 'Updated ' + new Date(DATA.generatedAt).toLocaleDateString('en-US', {month:'short', day:'numeric'});
  document.getElementById('footer-meta').textContent = 'Auto-updating · Last refresh on visit';

  const cs = document.getElementById('current-section');
  if (current) {
    const daysLeft = Math.round((new Date(current.checkOut + 'T00:00:00') - new Date(TODAY + 'T00:00:00')) / 86400000);
    const outbound = transitsFromCity(current);
    const outboundHTML = outbound.length > 0
      ? '<div class="accom-block"><div class="accom-label">Next leg out</div>' + outbound.map(buildTransit).join('') + '</div>'
      : '';
    cs.innerHTML = '<div class="current-banner"><div class="you-are-here-badge">● ' + escapeHTML(TRAVELER) + ' is here</div><h2>' + escapeHTML(current.name) + '<span class="country">' + escapeHTML(current.country) + (current.state ? ' · ' + escapeHTML(current.state) : '') + '</span></h2><div class="dates">' + fmtDate(current.checkIn) + ' → ' + fmtDate(current.checkOut) + '<span class="days-left">' + daysLeft + ' day' + (daysLeft===1?'':'s') + ' left</span></div>' + (current.accommodations.length ? '<div class="accom-block"><div class="accom-label">Where ' + escapeHTML(TRAVELER) + ' is staying</div>' + renderAccoms(current.accommodations, true) + '</div>' : '') + outboundHTML + '</div>';
  } else {
    cs.innerHTML = '<div class="current-banner" style="border-color:var(--border);box-shadow:var(--shadow-sm);padding-top:24px"><div style="text-align:center;color:var(--text-3);font-style:italic;font-family:Fraunces,serif;font-size:18px">Between stays — see upcoming below</div></div>';
  }

  document.getElementById('map-legend').innerHTML =
    '<span><span class="dot" style="background:#c72027"></span>Currently here</span>' +
    '<span><span class="dot" style="background:#2d7d34"></span>Booked</span>' +
    '<span><span class="dot" style="background:#2c5d8a"></span>Shortlisted</span>' +
    '<span><span class="dot" style="background:#8a6d00"></span>Tentative</span>' +
    '<span><span class="dot" style="background:#8a8a8a"></span>Past</span>';

  const fs = document.getElementById('future-section');
  fs.innerHTML = '<div class="section-head"><h2>What\'s coming up</h2><span class="meta">' + future.length + ' stop' + (future.length===1?'':'s') + '</span></div>';
  if (future.length === 0) {
    fs.innerHTML += '<div class="empty">No upcoming trips planned yet.</div>';
  } else {
    future.forEach(c => {
      fs.innerHTML += buildLeg(c, false);
      transitsFromCity(c).forEach(t => fs.innerHTML += buildTransit(t));
    });
  }

  if (past.length > 0) {
    const ps = document.getElementById('past-section');
    ps.innerHTML = '<div class="section-head"><h2>Where ' + escapeHTML(TRAVELER) + ' has been</h2><span class="meta">' + past.length + ' stop' + (past.length===1?'':'s') + '</span></div>';
    past.forEach(c => {
      ps.innerHTML += buildLeg(c, true);
      transitsFromCity(c).forEach(t => ps.innerHTML += buildTransit(t));
    });
  }

  initMap(DATA.cities, current);
}

function buildLeg(c, isPast) {
  const cls = isPast ? 'leg past' : 'leg';
  return '<div class="' + cls + '"><div class="leg-head"><div class="leg-title">' + escapeHTML(c.name) + '<span class="country">' + escapeHTML(c.country) + (c.state ? ' · ' + escapeHTML(c.state) : '') + '</span>' + pill(c.status) + '</div><div class="leg-dates">' + fmtDate(c.checkIn) + ' → ' + fmtDate(c.checkOut) + '</div></div>' + (c.accommodations.length ? '<div class="leg-accom">' + renderAccoms(c.accommodations, false) + '</div>' : '') + '</div>';
}

// Icon mapper for transit modes (must match the admin app's TRANSITION_MODES)
const TRANSIT_ICONS = { flight: '✈', train: '🚆', cruise: '🚢', bus: '🚌', ferry: '⛴', drive: '🚗', rideshare: '🚖', other: '➜' };
const TRANSIT_LABELS = { flight: 'Flight', train: 'Train', cruise: 'Cruise', bus: 'Bus', ferry: 'Ferry', drive: 'Drive', rideshare: 'Rideshare', other: 'Travel' };

function buildTransit(t) {
  if (!t) return '';
  const isPast = t.arrivalDate && t.arrivalDate < TODAY;
  const cls = 'transit status-' + (t.status || 'tentative') + (isPast ? ' past' : '');
  const icon = TRANSIT_ICONS[t.mode] || '➜';
  const label = TRANSIT_LABELS[t.mode] || 'Travel';
  const carrierBit = (t.carrier || t.number) ? [t.carrier, t.number].filter(Boolean).join(' ') : label;
  const route = (t.fromCity && t.toCity) ? escapeHTML(t.fromCity) + ' → ' + escapeHTML(t.toCity) : (t.toCity ? '→ ' + escapeHTML(t.toCity) : '');
  let timeBit = '';
  if (t.departureDate) {
    timeBit = fmtDate(t.departureDate);
    if (t.departureTime) timeBit += ' · ' + t.departureTime;
    if (t.arrivalTime) timeBit += ' → ' + t.arrivalTime;
  }
  return '<div class="' + cls + '">' +
    '<span class="transit-ic">' + icon + '</span>' +
    '<div class="transit-main">' +
      '<div class="transit-line1">' + escapeHTML(carrierBit) + '</div>' +
      '<div class="transit-line2">' + route + '</div>' +
    '</div>' +
    '<div class="transit-time">' + timeBit + '</div>' +
  '</div>';
}

// Find transitions departing from a given city.
// Match strictly by ID when both sides have one (handles multiple cities with the same name,
// e.g. past Atlanta vs. future Atlanta). Fall back to case-insensitive name only when ID is
// missing on either side (older data or legacy imports).
function transitsFromCity(city) {
  if (!DATA.transitions || !city) return [];
  const targetId = city.id || '';
  const targetName = (city.name || '').trim().toLowerCase();
  return DATA.transitions.filter(t => {
    if (targetId && t.fromCityId) return t.fromCityId === targetId;
    return (t.fromCity || '').trim().toLowerCase() === targetName;
  });
}

function initMap(cities, current) {
  const valid = cities.filter(c => typeof c.lat === 'number' && typeof c.lng === 'number');
  if (valid.length === 0) {
    document.getElementById('map').innerHTML = '<div class="empty" style="margin:20px">No locations to map yet.</div>';
    document.querySelector('.map-reset-btn').style.display = 'none';
    return;
  }
  const map = L.map('map').setView([valid[0].lat, valid[0].lng], 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 18 }).addTo(map);
  const bounds = [];
  valid.forEach(c => {
    const isCurrent = current && c.name === current.name && c.checkIn === current.checkIn;
    const color = colorFor(c, isCurrent);
    const radius = isCurrent ? 12 : 7;
    const marker = L.circleMarker([c.lat, c.lng], { radius: radius, color: 'white', weight: 2, fillColor: color, fillOpacity: 0.95 }).addTo(map);
    const datesBit = c.checkIn ? '<br><small style="font-family:JetBrains Mono,monospace;color:#666">' + fmtDate(c.checkIn) + ' → ' + fmtDate(c.checkOut) + '</small>' : '';
    const statusBit = !isCurrent && c.status ? '<br><small style="color:' + color + ';font-weight:600;text-transform:uppercase;letter-spacing:0.08em;font-family:JetBrains Mono,monospace;font-size:9px">' + c.status + '</small>' : '';
    marker.bindPopup('<strong style="font-family:Fraunces,serif;font-size:15px">' + escapeHTML(c.name) + '</strong><br><span style="font-family:JetBrains Mono,monospace;font-size:10px;color:#666;letter-spacing:0.08em;text-transform:uppercase">' + escapeHTML(c.country) + '</span>' + datesBit + statusBit + (isCurrent ? '<br><strong style="color:#c72027;font-family:JetBrains Mono,monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase">★ ' + escapeHTML(TRAVELER) + ' is here</strong>' : ''));
    bounds.push([c.lat, c.lng]);
  });
  // Store for reset button
  window._famMap = map;
  window._famBounds = bounds;
  if (bounds.length > 1) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
}

function resetMapView() {
  if (!window._famMap || !window._famBounds) return;
  if (window._famBounds.length > 1) {
    window._famMap.fitBounds(window._famBounds, { padding: [40, 40], maxZoom: 8 });
  } else if (window._famBounds.length === 1) {
    window._famMap.setView(window._famBounds[0], 8);
  }
}

render();
</script>
</body>
