<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    display: inline-block; margin-top: 18px; padding: 10px 18px;

<body>
<!--
  The trip editor moved to https://cityops.robriggs.com/trip/, where it is
  one half of one app with the city guides: one origin, one sign-in, one
  credential store.

  This page deliberately does NOT touch localStorage. There is nothing here
  worth reading and nothing here worth clearing: the data this browser holds
  under the old origin was already carried to the account by sync, and wiping it
  would destroy the one local copy of anyone who never signed in. It redirects
  and it says so, and that is all it does.

  robs-travel-itinerary.html, the generated family page served at
  wheres.robriggs.com, still lives in this repo and is still what Publish writes
  to. It is unaffected by this file.
-->
<div class="card">
  <p><strong>The trip editor moved.</strong> It now lives at
    <a href="https://cityops.robriggs.com/trip/">cityops.robriggs.com/trip/</a>,
    alongside the city guides: one app, one sign-in. Your data is in your account, so nothing is lost.</p>
  <a class="go" href="https://cityops.robriggs.com/trip/">Open the trip editor</a>
</div>
<script>
  // Belt and braces on the meta refresh: replace() rather than assign(), so the
  // back button goes where the traveler actually came from instead of bouncing
  // them through this page again.
  try { location.replace('https://cityops.robriggs.com/trip/'); } catch (e) {}
</script>
</body>
